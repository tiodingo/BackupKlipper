# Arquivo configurado para Creality V4.2.2 (32-bit) com BLTouch original
# Baseado nos pinos oficiais do chip STM32F103/GD32F303 da Creality

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop     # Usa o BLTouch como fim de curso do Z
position_min: -3                         # Permite descer abaixo de 0 para calibração
position_max: 250

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB4
dir_pin: !PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
x_offset: -44.0         # Ajuste se usar um suporte impresso diferente
y_offset: -9.0          # Ajuste se usar um suporte impresso diferente
z_offset: 0.0           # Valor inicial para iniciar o sistema elétrico
speed: 3.0
samples: 2

[safe_z_home]
home_xy_position: 117.5, 117.5 # Envia o bico ao centro da mesa para fazer o Home do Z
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 204.5, 207
screw4: 204.5, 37

[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PB14, ^PA14   # 👈 Corrigido aqui (era ^PB14, ^8)
click_pin: ^!PB2


[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancela a impressao atual
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Pausa a impressao atual
rename_existing: BASE_PAUSE
gcode:
    BASE_PAUSE
    SET_IDLE_TIMEOUT TIMEOUT=3600

[gcode_macro RESUME]
description: Retoma a impressao pausada
rename_existing: BASE_RESUME
gcode:
    BASE_RESUME
