# Arquivo configurado para Creality V4.2.2 (32-bit) com BLTouch original
# Baseado nos pinos oficiais do chip STM32F103/GD32F303 da Creality
#backup teste

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop     # Usa o BLTouch como fim de curso do Z
position_min: -3                         # Permite descer abaixo de 0 para calibração
position_max: 250

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 34.406
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250
pressure_advance: 0.025


[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
x_offset: -44.0         # Ajuste se usar um suporte impresso diferente
y_offset: -9.0          # Ajuste se usar um suporte impresso diferente
#z_offset: 0.0           # Valor inicial para iniciar o sistema elétrico
speed: 3.0
samples: 2

[safe_z_home]
home_xy_position: 117.5, 117.5 # Envia o bico ao centro da mesa para fazer o Home do Z
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 204.5, 207
screw4: 204.5, 37

[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PB14, ^PA14   # 👈 Corrigido aqui (era ^PB14, ^8)
click_pin: ^!PB2


[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancela a impressao atual
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Pausa a impressao atual
rename_existing: BASE_PAUSE
gcode:
    BASE_PAUSE
    SET_IDLE_TIMEOUT TIMEOUT=3600

[gcode_macro RESUME]
description: Retoma a impressao pausada
rename_existing: BASE_RESUME
gcode:
    BASE_RESUME

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20, 20       # Mantém uma boa margem física à esquerda e à frente
mesh_max: 190, 220     # RECALCULADO: X reduzido para 190 para o bico não bater em 234
probe_count: 5, 5      # Aumentado para 5x5 (25 pontos) para mapear melhor as ondulações
algorithm: bicubic     # Bicubic é mais preciso e suave para malhas de 5x5

[gcode_macro START_PRINT]
gcode:
    # Captura as temperaturas com valores de segurança caso falte informação
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    M117 Aquecendo mesa...
    M140 S{BED_TEMP}             # Inicia aquecimento da mesa
    M104 S150                    # Mantém o bico morno (150°C) para não babar plástico
    M190 S{BED_TEMP}             # Espera a mesa atingir a temperatura ideal
    
    M117 Fazendo Home...
    G90                          # Modo de coordenadas absolutas para o Home
    G28                          # Faz o Home de todos os eixos com o bico limpo
    
    M117 Carregando Bed Mesh...
    BED_MESH_PROFILE LOAD=default # Carrega a sua malha de 25 pontos automaticamente
    
    M117 Aquecendo bico...
    G1 X5 Y20 Z10 F5000          # Move o bico para o início da lateral esquerda
    M109 S{EXTRUDER_TEMP}        # Espera o bico atingir a temperatura final de impressão
    
    M117 Fazendo linha de purga...
    G92 E0                       # Reseta o contador da extrusora
    G1 Z0.28 F240
    G1 Y200 E15 F1200            # LINHA LONGA: Vai até o fundo da mesa (Y200) soltando mais filamento
    G92 E0                       # Reseta a extrusora novamente
    
    # CORREÇÃO DO ORCASLICER:
    G90                          # Garante que a impressora está em Modo Absoluto antes da peça
    M83                          # Garante que a Extrusora está em Modo Relativo (Padrão do Orca)
    
    M117 Imprimindo peca!

# ======================================================================
# 🌟 NOVAS MACROS DE UTILIDADE (FILAMENTO E TROCA DE COR)
# ======================================================================

[gcode_macro INSERIR_FILAMENTO]
description: Aquece e puxa o filamento novo para dentro do bico
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M117 Aquecendo para carregar...
    M109 S{EXTRUDER_TEMP}        # Garante que o extrusor está quente
    M117 Carregando filamento...
    M83                          # Extrusora em modo relativo
    G1 E50 F300                  # Puxa 50mm rapidamente
    G1 E20 F150                  # Purga 20mm devagar para limpar a cor anterior
    G92 E0
    M117 Filamento carregado!

[gcode_macro RETIRAR_FILAMENTO]
description: Aquece e retira o filamento atual do bico
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M117 Aquecendo para descarregar...
    M109 S{EXTRUDER_TEMP}
    M117 Retirando filamento...
    M83
    G1 E10 F150                  # Empurra um pouquinho para derreter a ponta engatada
    G1 E-70 F600                 # Puxa o filamento todo para fora da extrusora
    G92 E0
    M117 Retire o filamento!

[gcode_macro TROCA_COR]
description: Troca de cor automatica (Pausa no meio da impressao)
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    PAUSE                        # Usa a macro de pausa existente
    G91
    G1 Z10 F3000                 # Sobe 10mm para afastar do modelo
    G90
    G1 X10 Y10 F5000             # Move a cabeca para o canto para o plastico velho nao pingar na peca
    UNLOAD_FILAMENT EXTRUDER_TEMP={EXTRUDER_TEMP} # Passa a temperatura correta para o descarregamento
    M117 Coloque o filamento novo e clique em Resume!




